[pytest]
testpaths = tests/unit tests/integration automation/lecture_parts/test_graph_client.py
addopts = -p no:cacheprovider
# The repo root, so tests/conftest.py can always import the database gate in
# tools/integration_db_guard.py, whichever way pytest is launched.
pythonpath = .
markers =
    production_data: asserts against KBC's real historical production evidence (named
        lectures, real dates, the real legacy dataset). NOT part of the release gate:
        the gate runs `-m "not production_data"`. These tests need an approved
        acceptance dataset and must never be pointed at production.
