# The console is a single-page app. This serves it and nothing else: no TLS,
# no domain, no upstream API block. Routing /api to the api service and
# terminating HTTPS are the infrastructure team's decisions, made in the
# edge proxy, not baked into the release image.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed asset filenames change on every build, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must NOT be cached, or a browser keeps loading an old bundle
    # that points at assets the new deployment has already replaced.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Any other path belongs to vue-router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
