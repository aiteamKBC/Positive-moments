services:
  media-worker:
    build: .
    image: kbc-media-worker:1.1.0
    container_name: kbc-media-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      TMP_DIR: /app/data/tmp
    # Only the worker's own scratch/state directory is mounted. The rest of the
    # Positive Mentions repository is never visible to this container.
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "node", "src/healthcheck.js"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
