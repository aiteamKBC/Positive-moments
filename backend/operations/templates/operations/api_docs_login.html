<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Sign in · KBC Publisher LMS API</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f5f7;
           font: 15px/1.5 system-ui, sans-serif; color: #1f2a44; }
    main { width: min(360px, calc(100vw - 32px)); background: #fff; border-radius: 8px; padding: 28px;
           box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }
    h1 { font-size: 18px; margin: 0 0 4px; }
    p { margin: 0 0 20px; color: #5a6275; font-size: 13px; }
    label { display: block; font-weight: 600; margin: 12px 0 4px; }
    input[type=text], input[type=password] { box-sizing: border-box; width: 100%; padding: 8px 10px;
           border: 1px solid #c4c9d4; border-radius: 4px; font: inherit; }
    button { margin-top: 20px; width: 100%; padding: 9px; border: 0; border-radius: 4px; background: #1f2a44;
             color: #fff; font: inherit; cursor: pointer; }
    .errors { color: #b42318; font-size: 13px; margin: 0 0 8px; }
  </style>
</head>
<body>
  <main>
    <h1>KBC Publisher LMS API</h1>
    <p>Internal documentation. Sign in with a Django staff account.</p>
    {% if refused %}<div class="errors">{{ refused }}</div>{% endif %}
    {% if form.non_field_errors %}<div class="errors">{% for error in form.non_field_errors %}{{ error }} {% endfor %}</div>{% endif %}
    <form method="post" action="{% url 'api-docs-login' %}">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      <label for="id_username">Username</label>
      <input type="text" name="username" id="id_username" autocomplete="username" autocapitalize="none" autofocus required>
      <label for="id_password">Password</label>
      <input type="password" name="password" id="id_password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
